<div class="vb-input">
  <input
    class="vb-input__field"
    [id]="id()"
    [name]="name()"
    [type]="type()"
    [attr.autocomplete]="autocomplete()"
    [attr.aria-label]="ariaLabel()"
    [attr.maxlength]="maxLength()"
    [disabled]="disabled()"
    [readonly]="isReadonly()"
    [placeholder]="placeholder()"
    [value]="value()"
    (input)="onInput($event)"
  />

  @if (counter()) {
    <div class="vb-input__meta" aria-live="polite">
      <span class="vb-input__counter">{{ counterLabel() }}</span>
    </div>
  }
</div>
