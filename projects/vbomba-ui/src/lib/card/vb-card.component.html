@if (hasTabs()) {
  <div
    class="vb-card__tabs"
    [class.vb-card__tabs--sticky]="stickyTabs()"
    [class.vb-card__tabs--bg-muted]="tabsBg() === 'muted'"
  >
    <vb-tabs
      [tabs]="tabs()"
      [stickyTabsBg]="tabsBg()"
      [(value)]="tabValue"
      [attr.aria-label]="tabsAriaLabel() || null"
    />
  </div>
  <div
    class="vb-card__body"
    [class.vb-card__body--scrollable]="scrollableBody()"
    [style.max-height]="scrollableBody() ? tabBodyMaxHeight() : null"
  >
    <ng-content />
  </div>
} @else {
  <ng-content />
}
