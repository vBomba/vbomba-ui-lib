<div class="vb-app-shell">
  <mat-toolbar
    class="vb-app-shell__toolbar"
    [class.vb-app-shell__toolbar--collapsed]="!isHandset() && sidenavCollapsed()"
  >
    <button
      class="vb-app-shell__toolbar-toggle"
      mat-icon-button
      type="button"
      (click)="toggleSidenav()"
      [attr.aria-label]="isHandset() ? 'Toggle navigation drawer' : 'Collapse or expand navigation'"
    >
      <i [class]="'vb-app-shell__toolbar-menu-icon ' + menuIconClass()" aria-hidden="true"></i>
    </button>
    <span class="vb-app-shell__title">{{ appTitle() }}</span>
    <span class="vb-app-shell__spacer"></span>
    @if (toolbarConnectionStatus(); as connectionStatus) {
      <vb-connection-indicator [status]="connectionStatus" [size]="12" />
    }
    @if (toolbarUserInfo(); as userInfo) {
      <vb-user-info
        [login]="userInfo.login ?? ''"
        [username]="userInfo.username ?? ''"
        [avatarUrl]="userInfo.avatarUrl ?? ''"
        [sessionDurationSeconds]="userInfo.sessionDurationSeconds ?? 0"
        [initialRemainingSeconds]="userInfo.initialRemainingSeconds ?? null"
      />
    }
    <ng-content select="[vbShellHeaderActions]" />
    <vb-theme-toggle />
  </mat-toolbar>

  <mat-sidenav-container #drawerContainer class="vb-app-shell__container" autosize>
    <mat-sidenav
      [mode]="sidenavMode()"
      [opened]="isHandset() ? sidenavOpened() : true"
      class="vb-app-shell__sidenav"
      [class.vb-app-shell__sidenav--collapsed]="!isHandset() && sidenavCollapsed()"
      (openedChange)="onSidenavOpenedChange($event)"
    >
      <mat-nav-list>
        @for (link of navLinks(); track link.path) {
          <a
            mat-list-item
            [disableRipple]="true"
            [routerLink]="link.path"
            routerLinkActive="vb-app-shell__nav--active"
            (click)="onNavigate()"
          >
            <i [class]="'vb-app-shell__nav-icon ' + link.icon" aria-hidden="true"></i>
            <span matListItemTitle class="vb-app-shell__nav-label">{{ link.label }}</span>
          </a>
        }
      </mat-nav-list>
    </mat-sidenav>
    <mat-sidenav-content class="vb-app-shell__content">
      @if (mainLoader(); as mainLoaderConfig) {
        <div class="vb-app-shell__main-loader-slot">
          @if (mainLoaderConfig.visible !== false) {
            <vb-loader
              variant="horizontal"
              [size]="mainLoaderConfig.size ?? 24"
              [aria-label]="mainLoaderConfig.ariaLabel ?? 'Loading page content'"
            />
          }
        </div>
      }
      <div class="vb-app-shell__main" [@vbMainRoute]="mainRouteState()">
        <router-outlet />
      </div>
    </mat-sidenav-content>
  </mat-sidenav-container>
</div>
